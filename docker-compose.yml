networks:
  vyx:
    driver: bridge

volumes:
  postgres-data:
  dragonfly-data:
  qdrant-data:

services:
  dashboard:
    build:
      context: .
      args:
        INFISICAL_TOKEN: ${INFISICAL_TOKEN_SERVICE}
    environment:
      - INFISICAL_TOKEN=${INFISICAL_TOKEN_SERVICE}
    networks:
      - vyx
    ports:
      - '3008:3000'
    restart: unless-stopped
    logging:
      options:
        max-size: '1g'
        max-file: '3'
    container_name: vyx-dashboard
    volumes:
      - './packages/inference-engine/auth.json:/app/auth.json:ro'
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  postgres:
    container_name: postgres-vyx
    networks:
      - vyx
    image: postgres:15-alpine
    ports:
      - '5435:5432'
    env_file:
      - .env.prod
    restart: always
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    logging:
      options:
        max-size: '20m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  dragonfly:
    container_name: dragonfly-vyx
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    networks:
      - vyx
    ulimits:
      memlock: -1
    ports:
      - '6379:6379'
    command: ['--cluster_mode=emulated', '--lock_on_hashtags']
    volumes:
      - dragonfly-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 30s

  qdrant:
    container_name: qdrant-vyx
    image: qdrant/qdrant:latest
    networks:
      - vyx
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      options:
        max-size: '10m'
        max-file: '3'
