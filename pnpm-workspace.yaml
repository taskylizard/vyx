packages:
  - '.'
  - '!rosepack/**'

allowBuilds:
  esbuild: true
  protobufjs: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.4
  vite-plus: 0.2.4
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.15'
  - '@ai-sdk/provider-utils@5.0.7'
  - '@ai-sdk/provider@4.0.3'
  - ai@7.0.19
  - rosepack@0.1.0 || 0.2.0 || 0.3.0
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
